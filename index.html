<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBDown Web</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 system-ui,-apple-system,sans-serif;background:#0f1117;color:#c9d1d9;max-width:820px;margin:0 auto;padding:20px}
h1{font-size:20px;margin-bottom:20px;color:#58a6ff}
.card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:16px;margin-bottom:12px}
input,button,select{font:inherit}
input[type="text"],input[type="number"]{width:100%;padding:8px 12px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;outline:none}
input:focus{border-color:#58a6ff}
select{padding:6px 10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;outline:none;cursor:pointer}
select:focus{border-color:#58a6ff}
button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:500}
.btn-primary{background:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{background:#da3633;color:#fff}
.btn-danger:hover{background:#f85149}
.btn-danger:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{padding:4px 10px;font-size:12px;background:transparent;border:1px solid #30363d;color:#c9d1d9}
.btn-outline:hover{border-color:#58a6ff;color:#58a6ff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:4px}
.flex1{flex:1}

#meta{margin-top:12px}
#meta .title{font-size:16px;font-weight:600;color:#fff}
#meta .sub{color:#8b949e;font-size:12px}

.stream-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stream-item{border:1px solid #30363d;border-radius:6px;padding:10px;cursor:pointer;transition:.15s}
.stream-item:hover{border-color:#58a6ff}
.stream-item.selected{border-color:#238636;background:#0d2818}
.stream-item .q{font-weight:600;font-size:13px;color:#fff}
.stream-item .d{font-size:11px;color:#8b949e;margin-top:2px}

.section-label{font-size:12px;font-weight:600;color:#8b949e;text-transform:uppercase;margin-bottom:6px;letter-spacing:.5px}
.section-label a{color:#58a6ff;text-decoration:none;font-weight:400;margin-left:8px;text-transform:none;letter-spacing:0}

/* mode selector */
.mode-row{display:flex;gap:4px;flex-wrap:wrap}
.mode-btn{position:relative;padding:6px 12px;border:1px solid #30363d;border-radius:6px;cursor:pointer;font-size:13px;transition:.15s;background:#0d1117;color:#8b949e}
.mode-btn:hover{border-color:#8b949e;color:#c9d1d9}
.mode-btn.selected{border-color:#58a6ff;color:#58a6ff;background:#0d2818}
.mode-btn input{position:absolute;opacity:0;pointer-events:none}

/* page selector */
.page-checks{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.page-chip{display:flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid #30363d;border-radius:4px;font-size:12px;cursor:pointer;user-select:none}
.page-chip:hover{border-color:#8b949e}
.page-chip input{width:auto}
.page-chip.checked{border-color:#238636;color:#7ee787}

/* progress */
.progress-bar{width:100%;height:6px;background:#30363d;border-radius:3px;overflow:hidden;margin:8px 0}
.progress-bar .fill{height:100%;background:#238636;transition:width .2s}
.progress-bar .fill.indeterminate{width:35%;animation:slide 1.3s infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
#log{max-height:200px;overflow-y:auto;font:12px/1.5 Consolas,monospace;color:#8b949e;background:#0d1117;padding:8px;border-radius:4px;margin-top:8px}

/* advanced */
.adv-toggle{cursor:pointer;font-size:12px;color:#58a6ff;user-select:none;display:inline-block;margin-top:8px}
.adv-toggle:hover{color:#79c0ff}
.adv-panel{border:1px solid #30363d;border-radius:6px;padding:12px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adv-panel .full{grid-column:1/-1}
.adv-panel label{font-size:12px;color:#8b949e;display:block;margin-bottom:0}
/* 参数名下面固定两行说明，各行输入框就能横向对齐；说明都控制在两行内，超了会撑高整行 */
.adv-hint{font-size:11px;line-height:1.5;color:#6e7681;font-weight:400;min-height:33px;margin:1px 0 4px}
/* 勾选项的说明比一条勾选文字还长，横排会挤成长条，改成两列、说明缩进到文字下面 */
#advPanel .check-row{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
#advPanel .check-label{display:grid;grid-template-columns:auto 1fr;column-gap:6px;align-items:center;align-content:start}
#advPanel .check-label input{grid-area:1/1}
#advPanel .check-label .ck-name{grid-area:1/2}
#advPanel .check-label .adv-hint{grid-area:2/2;margin:1px 0 0}
.adv-panel input[type="text"],.adv-panel input[type="number"]{padding:5px 8px;font-size:12px}

/* file list */
.file-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #30363d22;gap:8px}
.file-row .fn{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .sz{font-size:12px;color:#8b949e;white-space:nowrap}
.file-row a{color:#58a6ff;text-decoration:none;font-size:12px}
.file-row a:hover{color:#79c0ff}
.file-row .ext-tag{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:500;white-space:nowrap}
.ext-video{background:#1a3a2a;color:#7ee787}
.ext-audio{background:#1a2a3a;color:#79c0ff}
.ext-sub{background:#3a2a1a;color:#d2a66e}
.ext-other{background:#1a1a2a;color:#8b949e}
.ext-img{background:#2a1a3a;color:#d2a9ff}

/* login */
#qrWrap{text-align:center;padding:10px}
#qrWrap img{width:200px;height:200px;border-radius:8px;border:2px solid #30363d}
#qrWrap .hint{font-size:13px;color:#8b949e;margin-top:8px}
#loginBar{display:flex;align-items:center;gap:12px}
#loginBar .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#loginBar .dot.ok{background:#238636}
#loginBar .dot.no{background:#da3633}

/* player */
#playerWrap{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#playerWrap.hidden{display:none}
#playerStage{position:relative;line-height:0}
#playerVideo{display:block;max-width:90vw;max-height:74vh;background:#000}
#dmCanvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#playerBar{display:flex;align-items:center;gap:14px;margin-top:12px;color:#c9d1d9;font-size:13px;flex-wrap:wrap;justify-content:center}
#playerName{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8b949e}

.hidden{display:none}
.check-label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.check-label input{width:auto}
.check-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}

.single-choice-group {display: flex;gap: 20px;align-items: center;}
.single-choice-group label {display: inline-flex;align-items: center;gap: 6px;cursor: pointer;}
/* .check-row 的 display:flex 排在 .hidden 之后，同权重会盖掉 .hidden，故按 ID 补一条 */
#extraOpts.hidden{display:none}
</style>
</head>
<body>

<h1>BBDown Web</h1>

<!-- ===== LOGIN ===== -->
<div class="card">
  <div id="loginBar">
    <span style="font-weight:600;font-size:13px">登录</span>
    <span class="dot no" id="loginDot"></span>
    <span id="loginText" style="font-size:13px">未登录</span>
    <button class="btn-sm btn-primary" id="btnLogin" style="margin-left:auto">扫码登录</button>
    <button class="btn-sm btn-danger hidden" id="btnCancelLogin">取消</button>
  </div>
  <div id="qrWrap" class="hidden">
    <img id="qrImg" src="" alt="QR Code">
    <div class="hint">打开B站APP扫描二维码</div>
  </div>
</div>

<!-- ===== SETTINGS ===== -->
<div class="card">
  <div class="row">
    <span style="font-weight:600;font-size:13px">下载目录</span>
    <input type="text" id="downloadDir" placeholder="下载文件存放路径（默认：本程序目录）" style="flex:1">
    <button class="btn-sm btn-outline" id="btnBrowse">选择目录</button>
    <button class="btn-sm btn-primary" id="btnSaveDir">保存</button>
    <span id="dirStatus" style="font-size:12px;color:#8b949e"></span>
  </div>
</div>

<!-- ===== PARSE ===== -->
<div class="card">
  <div class="row" style="margin-bottom:8px">
    <input type="text" id="url" placeholder="粘贴B站视频链接 (BV号/AV号/EP号/SS号)" autofocus style="flex:1">
    <select id="apiMode" style="width:80px">
      <option value="">WEB</option>
      <option value="tv">TV</option>
      <option value="app">APP</option>
    </select>
    <button class="btn-primary" id="btnParse">解析</button>
  </div>
  <div id="meta" class="hidden"></div>
  <div id="pageSelector" class="hidden" style="margin-top:8px">
    <div class="section-label">分P选择 <a href="#" id="selAll">全选</a> <a href="#" id="selNone">取消</a></div>
    <div id="pageChecks" class="page-checks"></div>
  </div>
</div>

<!-- ===== DOWNLOAD ===== -->
<div id="selector" class="card hidden">
  <!-- download mode -->
  <div class="section-label">下载模式</div>
  <div class="mode-row" id="modeRow">
    <label class="mode-btn selected"><input type="radio" name="dlMode" value="" checked>视频+音频</label>
    <label class="mode-btn"><input type="radio" name="dlMode" value="video">仅视频</label>
    <label class="mode-btn"><input type="radio" name="dlMode" value="audio">仅音频</label>
    <label class="mode-btn"><input type="radio" name="dlMode" value="danmaku">仅弹幕</label>
    <label class="mode-btn"><input type="radio" name="dlMode" value="sub">仅字幕</label>
    <label class="mode-btn"><input type="radio" name="dlMode" value="cover">仅封面</label>
  </div>

  <!-- video streams -->
  <div id="videoSection" style="margin-top:12px">
    <div class="section-label">视频画质 & 编码</div>
    <div id="videoStreams" class="stream-grid"></div>
  </div>

  <!-- audio streams -->
  <div id="audioSection" style="margin-top:12px">
    <div class="section-label">音频质量</div>
    <div id="audioStreams" class="stream-grid"></div>
  </div>

  <!-- extra options -->
  <div id="extraOpts" class="check-row">
    <label class="check-label"><input type="checkbox" id="danmaku"> 同时下载弹幕</label>
    <label class="check-label"><input type="checkbox" id="subAll" checked> 同时下载字幕(人工+AI)</label>
    <label class="check-label"><input type="checkbox" id="dlCover" checked> 同时下载封面</label>
  </div>

  <!-- advanced toggle -->
  <div class="adv-toggle" id="advToggle">▶ 高级设置</div>
  <div class="adv-panel hidden" id="advPanel">
    <div>
      <label>文件名模板</label>
      <div class="adv-hint">单个视频的输出文件名，可用 &lt;videoTitle&gt; 等变量</div>
      <input type="text" id="filePattern" placeholder="&lt;videoTitle&gt;">
    </div>
    <div>
      <label>多P文件名模板</label>
      <div class="adv-hint">多P视频各分P的命名规则，&lt;pageNumberWithZero&gt; 是补零分P号</div>
      <input type="text" id="multiFilePattern" placeholder="&lt;videoTitle&gt;/[P&lt;pageNumberWithZero&gt;]&lt;pageTitle&gt;">
    </div>
    <div>
      <label>语言代码 (如 chi, jpn)</label>
      <div class="adv-hint">只下指定语言的字幕，留空则全部下载</div>
      <input type="text" id="language" placeholder="默认">
    </div>
    <div>
      <label>分P下载间隔 (秒)</label>
      <div class="adv-hint">多P之间等待的秒数，填 1~3 可降低被限流概率</div>
      <input type="number" id="delayPerPage" value="0" min="0" style="width:100px">
    </div>
    <div>
      <label>User-Agent</label>
      <div class="adv-hint">留空则随机；登录态异常时可填自己的浏览器 UA</div>
      <input type="text" id="userAgent" placeholder="随机UA">
    </div>
    <div>
      <label>Cookie 字符串</label>
      <div class="adv-hint">不想扫码时，从浏览器复制含 SESSDATA 的整串填入</div>
      <input type="text" id="cookie" placeholder="手动填入cookie">
    </div>
    <div class="full check-row">
      <label class="check-label"><input type="checkbox" id="audioAsc"><span class="ck-name">音频升序(最小优先)</span><span class="adv-hint">自动改选体积最小的音频，勾上时忽略上面点的那条</span></label>
      <label class="check-label"><input type="checkbox" id="skipMux"><span class="ck-name">跳过混流</span><span class="adv-hint">保留分离的音频和视频，不合并成一个文件</span></label>
      <label class="check-label"><input type="checkbox" id="noMultiThread"><span class="ck-name">关闭多线程</span><span class="adv-hint">报"不支持多线程下载"时勾选，改用单线程</span></label>
      <label class="check-label"><input type="checkbox" id="saveArchives"><span class="ck-name">存档记录(跳过重复)</span><span class="adv-hint">记下已下载的视频，重复下载时自动跳过</span></label>
    </div>

    <div class="full single-choice-group">
      <span id="formatting-tip" style="font-size:12px;color:#8b949e">下载后的格式转换</span>

      <label>
        <input type="radio" name="format" value="none" checked>
        不转换
      </label>

      <label>
        <input type="radio" name="format" value="mp3">
        MP3
      </label>

      <label>
        <input type="radio" name="format" value="flac">
        FLAC
      </label>

      <label>
        <input type="radio" name="format" value="ogg">
        OGG
      </label>

      <label>
        <input type="radio" name="format" value="mov">
        MOV
      </label>
    </div>
  </div>

  <!-- download button + progress -->
  <div class="row" style="margin-top:12px">
    <button class="btn-primary" id="btnDownload" disabled>开始下载</button>
    <span id="dlStatus" style="font-size:13px;color:#8b949e"></span>
  </div>
  <div class="progress-bar hidden" id="progressWrap"><div class="fill" id="progressFill" style="width:0%"></div></div>
  <div id="log" class="hidden"></div>
</div>

<!-- ===== FILES ===== -->
<div class="card">
  <div class="section-label">已下载文件</div>
  <div id="fileList">加载中...</div>
</div>

<!-- ===== PLAYER ===== -->
<div id="playerWrap" class="hidden">
  <div id="playerStage">
    <video id="playerVideo" controls></video>
    <canvas id="dmCanvas"></canvas>
  </div>
  <div id="playerBar">
    <span id="playerName"></span>
    <label class="check-label"><input type="checkbox" id="dmOn" checked> 显示弹幕</label>
    <span id="dmInfo"></span>
    <button class="btn-sm btn-outline" id="playerClose">关闭</button>
  </div>
</div>

<script src="qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s)
const $$ = s => document.querySelectorAll(s)

let videoInfo = null
let selVideoIdx = null
let selAudioIdx = null
let loginPoll = null
let allFiles = []

// ========== LOGIN ==========
async function checkLogin() {
  try {
    const r = await fetch('/api/login/status')
    const d = await r.json()
    if (d.loggedIn) {
      $('#loginDot').className = 'dot ok'
      $('#loginText').textContent = '已登录'
      $('#btnLogin').textContent = '重新登录'
    } else if (d.loginInProgress) {
      $('#loginDot').className = 'dot no'
      $('#loginText').textContent = d.message || '等待扫码...'
    } else {
      $('#loginDot').className = 'dot no'
      $('#loginText').textContent = d.message || '未登录'
    }
    return d
  } catch (_) { return {} }
}

function startLogin() {
  return async () => {
    $('#btnLogin').disabled = true
    $('#btnLogin').textContent = '生成中...'
    $('#qrWrap').classList.remove('hidden')
    $('#qrImg').src = ''

    try {
      const r = await fetch('/api/login/start', { method: 'POST' })
      const d = await r.json()
      if (d.ok && d.qrcodeUrl) {
        const qr = qrcode(0, 'M')
        qr.addData(d.qrcodeUrl)
        qr.make()
        $('#qrImg').src = qr.createDataURL(4, 4)
        $('#loginText').textContent = '等待扫码...'
        $('#btnCancelLogin').classList.remove('hidden')
        $('#btnLogin').classList.add('hidden')

        const poll = setInterval(async () => {
          const s = await checkLogin()
          if (s.loggedIn) {
            clearInterval(poll)
            endLoginUI()
            $('#loginText').textContent = '已登录 ✓'
            setTimeout(() => { if ($('#loginText').textContent === '已登录 ✓') $('#loginText').textContent = '已登录' }, 3000)
          }
        }, 2000)
        $('#btnCancelLogin').dataset.pollId = poll
      } else {
        alert('启动失败')
        endLoginUI()
      }
    } catch (e) {
      alert('登录失败: ' + e.message)
      endLoginUI()
    }
  }
}

function endLoginUI() {
  $('#qrWrap').classList.add('hidden')
  $('#btnCancelLogin').classList.add('hidden')
  $('#btnLogin').classList.remove('hidden')
  $('#btnLogin').disabled = false
  $('#btnLogin').textContent = '扫码登录'
}

$('#btnLogin').onclick = startLogin()

$('#btnCancelLogin').onclick = () => {
  const poll = $('#btnCancelLogin').dataset.pollId
  if (poll) clearInterval(+poll)
  fetch('/api/login/cancel', { method: 'POST' }).catch(() => {})
  endLoginUI()
  $('#loginText').textContent = '未登录'
}

// ========== PARSE ==========
$('#btnParse').onclick = async () => {
  const url = $('#url').value.trim()
  if (!url) return
  $('#btnParse').disabled = true; $('#btnParse').textContent = '解析中...'
  $('#meta').classList.add('hidden'); $('#selector').classList.add('hidden')
  try {
    const body = { url, apiMode: $('#apiMode').value }
    const r = await fetch('/api/info', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
    const data = await r.json()
    if (data.error) throw new Error(data.error)
    videoInfo = data
    renderMeta(data)
    renderStreams(data)
    renderPages(data)
    $('#selector').classList.remove('hidden')
    $('#btnDownload').disabled = false
  } catch (e) {
    alert('解析失败: ' + e.message)
  } finally {
    $('#btnParse').disabled = false; $('#btnParse').textContent = '解析'
  }
}

function renderMeta(d) {
  $('#meta').classList.remove('hidden')
  let html = `<div class="title">${esc(d.title)}</div>`
  html += `<div class="sub">${esc(d.upHome)} · ${esc(d.date)}</div>`
  html += `<div class="sub" style="margin-top:2px">视频流: ${d.videoStreams.length}个 · 音频流: ${d.audioStreams.length}个 · 分P: ${d.pages.length}个</div>`
  if (d.cmd) html += `<div class="sub" style="margin-top:2px;font-size:10px;opacity:0.5">${esc(d.cmd)}</div>`
  $('#meta').innerHTML = html
}

function renderPages(d) {
  if (d.pages.length <= 1) { $('#pageSelector').classList.add('hidden'); $('#pageChecks').innerHTML = ''; return }
  $('#pageSelector').classList.remove('hidden')
  $('#pageChecks').innerHTML = d.pages.map(p => `
    <label class="page-chip checked"><input type="checkbox" value="${p.index}" checked>P${p.index} ${esc(p.title)}</label>
  `).join('')
  $('#selAll').onclick = e => { e.preventDefault(); $$('#pageChecks input').forEach(c => { c.checked = true; c.parentElement.classList.add('checked') }) }
  $('#selNone').onclick = e => { e.preventDefault(); $$('#pageChecks input').forEach(c => { c.checked = false; c.parentElement.classList.remove('checked') }) }
  $$('#pageChecks input').forEach(c => c.onchange = () => c.parentElement.classList.toggle('checked', c.checked))
}

function renderStreams(d) {
  selVideoIdx = d.videoStreams.length > 0 ? 0 : null
  selAudioIdx = d.audioStreams.length > 0 ? 0 : null
  $('#videoStreams').innerHTML = d.videoStreams.map((s, i) => `
    <div class="stream-item ${i===0?'selected':''}" data-idx="${i}" data-type="video">
      <div class="q">${esc(s.quality)}</div>
      <div class="d">${s.width}x${s.height} · ${s.codec} · ${fps(s.fps)}</div>
      <div class="d">${s.bitrate}kbps · ${esc(s.size)}</div>
    </div>`).join('')
  $('#audioStreams').innerHTML = d.audioStreams.map((s, i) => `
    <div class="stream-item ${i===0?'selected':''}" data-idx="${i}" data-type="audio">
      <div class="q">M4A</div>
      <div class="d">${s.bitrate} kbps · ${esc(s.size)}</div>
    </div>`).join('')
  $$('#videoStreams .stream-item').forEach(el => el.onclick = () => {
    $$('#videoStreams .stream-item').forEach(e => e.classList.remove('selected'))
    el.classList.add('selected'); selVideoIdx = +el.dataset.idx
  })
  $$('#audioStreams .stream-item').forEach(el => el.onclick = () => {
    $$('#audioStreams .stream-item').forEach(e => e.classList.remove('selected'))
    el.classList.add('selected'); selAudioIdx = +el.dataset.idx
  })
  syncAudioAsc()
  updateDlMode()
}

// 勾了"音频升序"就自动选中体积最小的那条音频，免得界面高亮和实际下载对不上
function syncAudioAsc() {
  if (!$('#audioAsc').checked || !videoInfo || !videoInfo.audioStreams.length) return
  const list = videoInfo.audioStreams
  let best = 0
  list.forEach((s, i) => { if (parseSizeStr(s.size) < parseSizeStr(list[best].size)) best = i })
  selAudioIdx = best
  $$('#audioStreams .stream-item').forEach((e, i) => e.classList.toggle('selected', i === best))
}

function fps(v) { return v === Math.floor(v) ? v.toString() : v.toFixed(3) }

// ========== DOWNLOAD MODE ==========
$('#modeRow').onchange = updateDlMode
$('#audioAsc').onchange = syncAudioAsc

function updateDlMode() {
  const mode = $$('input[name="dlMode"]:checked')[0]?.value || ''
  $$('.mode-btn').forEach(b => b.classList.remove('selected'))
  $$('input[name="dlMode"]:checked')[0]?.parentElement.classList.add('selected')

  const needVideo = mode === '' || mode === 'video'
  const needAudio = mode === '' || mode === 'audio'

  $('#videoSection').classList.toggle('hidden', !needVideo)
  $('#audioSection').classList.toggle('hidden', !needAudio)
  // 附加内容(弹幕/字幕/封面)只在"视频+音频"模式下出现
  $('#extraOpts').classList.toggle('hidden', mode !== '')

  // 仅字幕模式勾上字幕（提交时不看这个框，但切回"视频+音频"时界面要对得上）
  if (mode === 'sub') $('#subAll').checked = true
}

// ========== DOWNLOAD ==========
$('#btnDownload').onclick = async () => {
  if (!videoInfo) return
  $('#btnDownload').disabled = true; $('#dlStatus').textContent = '启动中...'
  $('#progressWrap').classList.remove('hidden'); $('#log').classList.remove('hidden')
  $('#log').innerHTML = ''; $('#progressFill').style.width = '0%'; $('#progressFill').classList.remove('indeterminate')

  const vs = selVideoIdx !== null ? videoInfo.videoStreams[selVideoIdx] : null
  const as = selAudioIdx !== null ? videoInfo.audioStreams[selAudioIdx] : null
  const mode = $$('input[name="dlMode"]:checked')[0]?.value || ''

  const body = {
    url: $('#url').value.trim(),
    apiMode: $('#apiMode').value,
    videoOnly: mode === 'video' || undefined,
    audioOnly: mode === 'audio' || undefined,
    danmakuOnly: mode === 'danmaku' || undefined,
    subOnly: mode === 'sub' || undefined,
    coverOnly: mode === 'cover' || undefined,
    dfnPriority: vs?.quality || undefined,
    encodingPriority: vs?.codec || undefined,
    // 音频流没有画质参数，只能靠 -ia 交互模式按序号指定，故把码率和体积一并传给后端反查序号
    audioBitrate: as?.bitrate || undefined,
    audioSize: as?.size || undefined,
    // 附加内容三项只在"视频+音频"模式生效，其他模式（含"仅字幕"）一律按模式自身的语义走
    downloadDanmaku: (mode === '' && $('#danmaku').checked) || undefined,
    skipMux: $('#skipMux').checked || undefined,
    subAll: mode === '' ? $('#subAll').checked : (mode === 'sub'),
    // 封面只在"视频+音频"跟随开关；"仅封面"必须不跳过；其余模式一律跳过（开关此时不可见）
    skipCover: (mode === 'cover' || (mode === '' && $('#dlCover').checked)) ? undefined : true,
    audioAscending: $('#audioAsc').checked || undefined,
    noMultiThread: $('#noMultiThread').checked || undefined,
    saveArchives: $('#saveArchives').checked || undefined,
    filePattern: $('#filePattern').value.trim() || '<videoTitle>/<pageTitle>',
    multiFilePattern: $('#multiFilePattern').value.trim() || '<videoTitle>/[P<pageNumberWithZero>]<pageTitle>',
    language: $('#language').value.trim() || undefined,
    delayPerPage: +$('#delayPerPage').value || undefined,
    userAgent: $('#userAgent').value.trim() || undefined,
    cookie: $('#cookie').value.trim() || undefined,
    formatting: document.querySelector("input[name=format]:checked").value
  }

  // page selection
  const totalPages = videoInfo.pages.length
  if (totalPages > 1) {
    const selPages = [...$$('#pageChecks input:checked')].map(c => c.value)
    if (selPages.length === 0) {
      alert('请至少选择一集')
      $('#btnDownload').disabled = false; $('#dlStatus').textContent = ''
      return
    }
    // 全选集必须显式传 ALL：不传 -p 时 BBDown 对番剧只下第一集
    body.selectPage = selPages.length === totalPages ? 'ALL' : selPages.join(',')
  }

  // clean undefined values
  Object.keys(body).forEach(k => { if (body[k] === undefined) delete body[k] })

  const r = await fetch('/api/download', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
  const reader = r.body.getReader()
  const dec = new TextDecoder(); let buf = ''
  while (true) {
    const { done, value } = await reader.read()
    if (value) buf += dec.decode(value, { stream: !done })
    const parts = buf.split(/\n\n/); buf = parts.pop() || ''
    for (const part of parts) {
      const lines = part.split('\n')
      let event = '', data = ''
      for (const line of lines) {
        if (line.startsWith('event: ')) event = line.slice(7)
        else if (line.startsWith('data: ')) data = line.slice(6)
      }
      if (!data) continue
      try {
        const obj = JSON.parse(data)
        if (event === 'progress') {
          if (obj.percent != null) {
            // 百分比型（BBDown 输出 % 时）
            $('#progressFill').classList.remove('indeterminate')
            $('#progressFill').style.width = obj.percent + '%'
            let t = obj.percent.toFixed(1) + '%'
            if (obj.speed != null) t += ' · ' + obj.speed + ' ' + (obj.speedUnit || 'B') + '/s'
            if (obj.done != null && obj.total != null) t += ' · ' + obj.done + ' ' + (obj.doneUnit || 'B') + ' / ' + obj.total + ' ' + (obj.totalUnit || 'B')
            $('#dlStatus').textContent = t
          } else if (obj.bytes != null) {
            // 字节型（BBDown 1.6.3 不输出百分比，用文件增长估算）
            const total = estTotalBytes()
            const spd = fmtSpeed(obj.speed)
            if (total > 0) {
              const pct = Math.min(100, (obj.bytes / total) * 100)
              $('#progressFill').classList.remove('indeterminate')
              $('#progressFill').style.width = pct + '%'
              $('#dlStatus').textContent = `下载中 · ${fmtSize(obj.bytes)} / ${fmtSize(total)} (约 ${pct.toFixed(0)}%) · ${spd}`
            } else {
              $('#progressFill').classList.add('indeterminate')
              $('#dlStatus').textContent = `下载中 · ${fmtSize(obj.bytes)} · ${spd}`
            }
          }
        }
        else if (event === 'status') $('#dlStatus').textContent = obj.msg
        else if (event === 'log') { $('#log').innerHTML += `<div>${esc(obj.msg)}</div>`; $('#log').scrollTop = $('#log').scrollHeight }
        else if (event === 'done') { $('#dlStatus').textContent = '下载完成 ✓'; $('#btnDownload').disabled = false; loadFiles() }
        else if (event === 'error') { $('#dlStatus').textContent = '错误: ' + obj.msg; $('#btnDownload').disabled = false }
      } catch (_) {}
    }
    if (done) break
  }
}

// ========== FILES ==========
async function loadFiles() {
  try {
    const files = await (await fetch('/api/files')).json()
    allFiles = files
    $('#fileList').innerHTML = files.length === 0
      ? '<div style="color:#8b949e;font-size:13px">暂无文件</div>'
      : files.map(f => {
          let tag = '', ext = f.name.split('.').pop().toLowerCase()
          if (/^(mp4|flv|mkv)$/.test(ext)) tag = '<span class="ext-tag ext-video">视频</span>'
          else if (/^(m4a|mp3)$/.test(ext)) tag = '<span class="ext-tag ext-audio">音频</span>'
          else if (ext === 'srt') tag = '<span class="ext-tag ext-sub">字幕</span>'
          // .ass 在本项目里只可能是「导出ASS」的产物（BBDown 字幕一律 .srt），归到弹幕一类
          else if (ext === 'ass' || ext === 'xml') tag = '<span class="ext-tag ext-other">弹幕</span>'
          else if (/^(jpg|jpeg|png|webp|gif)$/.test(ext)) tag = '<span class="ext-tag ext-img">封面</span>'
          let actions = ''
          if (/^(mp4|flv|mkv|m4a|mp3)$/.test(ext)) actions += `<a href="#" class="btn-play" data-fn="${esc(f.name)}">播放</a>`
          else if (ext === 'ass' || ext === 'xml' || ext === 'srt' || /^(jpg|jpeg|png|webp|gif)$/.test(ext)) actions += `<a href="/api/file/${encodeURIComponent(f.name)}?view=1" target="_blank">查看</a>`
          if (ext === 'xml') actions += `<a href="#" class="btn-ass" data-fn="${esc(f.name)}">导出ASS</a>`
          actions += `<a href="/api/file/${encodeURIComponent(f.name)}">下载</a>`
          actions += `<a href="#" class="btn-del" data-fn="${esc(f.name)}" style="color:#f85149">删除</a>`
          return `<div class="file-row">${tag}<span class="fn">${esc(f.name)}</span><span class="sz">${fmtSize(f.size)}</span>${actions}</div>`
        }).join('')
    // bind play
    $$('.btn-play').forEach(b => b.onclick = e => { e.preventDefault(); openPlayer(b.dataset.fn) })
    // bind ass export
    $$('.btn-ass').forEach(b => b.onclick = e => { e.preventDefault(); exportAss(b.dataset.fn) })
    // bind delete
    $$('.btn-del').forEach(b => b.onclick = async e => {
      e.preventDefault()
      if (!confirm('删除 ' + b.dataset.fn + ' ?')) return
      await fetch('/api/file/' + encodeURIComponent(b.dataset.fn), { method: 'DELETE' })
      loadFiles()
    })
  } catch (_) { $('#fileList').textContent = '加载失败' }
}

function fmtSize(b) {
  if (!b) return '0 B'
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++ }
  return b.toFixed(1) + ' ' + u[i]
}
function fmtSpeed(bps) {
  if (!bps) return '0 B/s'
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0
  while (bps >= 1024 && i < u.length - 1) { bps /= 1024; i++ }
  return bps.toFixed(1) + ' ' + u[i] + '/s'
}
function parseSizeStr(s) {
  const m = String(s || '').match(/([\d.]+)\s*(KB|MB|GB)/i)
  if (!m) return 0
  const v = parseFloat(m[1]), u = m[2].toUpperCase()
  return v * (u === 'KB' ? 1024 : u === 'MB' ? 1048576 : 1073741824)
}
function estTotalBytes() {
  if (!videoInfo) return 0
  const mode = $$('input[name="dlMode"]:checked')[0]?.value || ''
  const vs = selVideoIdx != null ? videoInfo.videoStreams[selVideoIdx] : null
  const as = selAudioIdx != null ? videoInfo.audioStreams[selAudioIdx] : null
  let t = 0
  if ((mode === '' || mode === 'video') && vs) t += parseSizeStr(vs.size)
  if ((mode === '' || mode === 'audio') && as) t += parseSizeStr(as.size)
  return t
}
function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '' }

// ========== PLAYER WITH DANMAKU ==========
// BBDown 下的是 B站 XML 弹幕(<d p="时间,模式,字号,颜色,...">)，播放器不认，
// 这里在页面内自己解析并叠加渲染，覆盖在 <video> 上。
const dmCvs = $('#dmCanvas'), dmCtx = dmCvs.getContext('2d')
let dmList = [], dmIdx = 0, dmActive = [], dmLanes = [], dmLaneCount = 1, dmDpr = 1
const DM_SCROLL = 8, DM_FIX = 4   // 滚动弹幕存活秒数 / 顶部底部固定秒数

function dmColor(c) { return '#' + ((c || 16777215) & 0xffffff).toString(16).padStart(6, '0') }

function parseDanmaku(text) {
  const doc = new DOMParser().parseFromString(text, 'text/xml')
  return [...doc.querySelectorAll('d')].map(el => {
    const p = (el.getAttribute('p') || '').split(',')
    return { t: parseFloat(p[0]), mode: parseInt(p[1], 10), size: parseInt(p[2], 10), color: parseInt(p[3], 10), text: el.textContent }
  }).filter(d => isFinite(d.t) && d.text).sort((a, b) => a.t - b.t)
}

// XML 弹幕 -> ASS。ASS 只是容器格式，内容是弹幕；转出来给 PotPlayer 这类只认字幕格式的播放器加载
function danmakuToAss(list) {
  const W = 1920, H = 1080, FONT = 40, SCROLL = 8, FIX = 4, LANE_H = 44, MAX_LANE = 22
  const dmEsc = s => String(s).replace(/\\/g, '\\\\').replace(/\{/g, '\\{').replace(/\}/g, '\\}').replace(/[\r\n]+/g, ' ')
  const assColor = c => {
    const v = (c || 16777215) & 0xffffff
    return '&H00' + [v & 255, (v >> 8) & 255, (v >> 16) & 255].map(x => x.toString(16).padStart(2, '0').toUpperCase()).join('')
  }
  const ts = t => {
    t = Math.max(0, t)
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60
    return `${h}:${String(m).padStart(2, '0')}:${s.toFixed(2).padStart(5, '0')}`
  }
  // 粗略估宽：CJK/全角按 1em，其余按 0.5em
  const estWidth = s => { let w = 0; for (const ch of s) w += /[\u2E80-\uFFFD]/.test(ch) ? 1 : 0.5; return w * FONT }

  const scrollFree = new Array(MAX_LANE).fill(0), topFree = new Array(MAX_LANE).fill(0), botFree = new Array(MAX_LANE).fill(0)
  const pick = (arr, t) => { for (let i = 0; i < MAX_LANE; i++) if (arr[i] <= t) return i; return -1 }

  const out = [
    '[Script Info]', 'ScriptType: v4.00+', `PlayResX: ${W}`, `PlayResY: ${H}`,
    'WrapStyle: 2', 'ScaledBorderAndShadow: yes', '',
    '[V4+ Styles]',
    'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
    `Style: DM,Microsoft YaHei,${FONT},&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,0,0,0,0,100,100,0,0,1,2,1,7,0,0,0,1`, '',
    '[Events]', 'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text'
  ]
  for (const d of list) {
    const col = `\\c${assColor(d.color)}`
    const txt = dmEsc(d.text)
    if (d.mode === 5 || d.mode === 4) {                     // 顶部 / 底部固定
      const free = d.mode === 5 ? topFree : botFree
      const l = pick(free, d.t); if (l < 0) continue
      free[l] = d.t + FIX
      const an = d.mode === 5 ? '\\an8' : '\\an2'
      const y = d.mode === 5 ? 10 + l * LANE_H : H - 10 - l * LANE_H
      out.push(`Dialogue: 0,${ts(d.t)},${ts(d.t + FIX)},DM,,0,0,0,,{${an}\\pos(${W / 2},${y})${col}}${txt}`)
    } else {                                                 // 滚动 1/2/3
      const l = pick(scrollFree, d.t); if (l < 0) continue
      const w = estWidth(d.text)
      scrollFree[l] = d.t + (w / (W + w)) * SCROLL + 0.2
      const y = 10 + l * LANE_H
      out.push(`Dialogue: 0,${ts(d.t)},${ts(d.t + SCROLL)},DM,,0,0,0,,{\\an7\\move(${W},${y},${-Math.round(w)},${y})${col}}${txt}`)
    }
  }
  return out.join('\r\n')
}

async function exportAss(name) {
  try {
    const txt = await (await fetch('/api/file/' + encodeURIComponent(name) + '?view=1')).text()
    const list = parseDanmaku(txt)
    if (!list.length) { alert('没解析到弹幕'); return }
    const blob = new Blob(['\ufeff' + danmakuToAss(list)], { type: 'text/plain;charset=utf-8' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = name.split(/[\\/]/).pop().replace(/\.xml$/i, '') + '.ass'
    a.click()
    setTimeout(() => URL.revokeObjectURL(a.href), 2000)
  } catch (e) { alert('导出失败: ' + e.message) }
}

function dmResize() {
  const v = $('#playerVideo')
  if (!v.videoWidth) return
  dmDpr = window.devicePixelRatio || 1
  dmCvs.width = v.clientWidth * dmDpr
  dmCvs.height = v.clientHeight * dmDpr
  dmCtx.setTransform(dmDpr, 0, 0, dmDpr, 0, 0)
  dmLaneCount = Math.max(1, Math.floor(v.clientHeight / 30))
  dmLanes = new Array(dmLaneCount).fill(0)
}

function dmPickLane(t) {
  for (let i = 0; i < dmLaneCount; i++) if (dmLanes[i] <= t) return i
  return -1
}

function dmSeek() {
  const v = $('#playerVideo'), t = v.currentTime
  dmIdx = dmList.findIndex(d => d.t >= t)
  if (dmIdx < 0) dmIdx = dmList.length
  dmActive = []
  dmLanes = new Array(dmLaneCount).fill(0)
}

function dmFrame() {
  requestAnimationFrame(dmFrame)
  if ($('#playerWrap').classList.contains('hidden')) return
  const v = $('#playerVideo')
  if (!v.videoWidth) return
  if (dmCvs.width !== Math.floor(v.clientWidth * dmDpr)) dmResize()
  const W = v.clientWidth, H = v.clientHeight, t = v.currentTime
  dmCtx.clearRect(0, 0, W, H)
  if (!$('#dmOn').checked) return

  // 补充进入时间轴的弹幕
  while (dmIdx < dmList.length && dmList[dmIdx].t <= t) {
    const d = dmList[dmIdx++]
    if (t - d.t > 1) continue                       // seek 后丢弃早已过期的
    const fixed = d.mode === 4 || d.mode === 5
    const lane = dmPickLane(t)
    if (lane < 0) continue
    dmCtx.font = `${d.size || 25}px sans-serif`
    const w = dmCtx.measureText(d.text).width
    const dur = fixed ? DM_FIX : DM_SCROLL
    // 滚动弹幕等队尾完全进场后才释放该行
    dmLanes[lane] = t + (fixed ? dur : (w / (W + w)) * dur) + 0.2
    dmActive.push({ ...d, lane, w, dur, fixed })
  }

  dmCtx.textBaseline = 'top'
  dmCtx.lineWidth = 2
  dmCtx.strokeStyle = 'rgba(0,0,0,.8)'
  dmActive = dmActive.filter(d => {
    const gone = t - d.t > d.dur
    if (gone) return false
    const y = d.fixed
      ? (d.mode === 5 ? d.lane * 30 + 4 : H - (d.lane + 1) * 30 - 4)
      : d.lane * 30 + 4
    const prog = (t - d.t) / d.dur
    const x = d.fixed ? (W - d.w) / 2 : W - (W + d.w) * prog
    dmCtx.font = `${d.size || 25}px sans-serif`
    dmCtx.fillStyle = dmColor(d.color)
    dmCtx.strokeText(d.text, x, y)
    dmCtx.fillText(d.text, x, y)
    return true
  })
}

async function openPlayer(name) {
  const v = $('#playerVideo')
  const base = name.replace(/\.[^.]+$/, '')
  // 同名 .xml 即该视频的弹幕
  const xmlFile = allFiles.find(f => /\.xml$/i.test(f.name) && f.name.replace(/\.[^.]+$/, '') === base)
  dmList = []; dmIdx = 0; dmActive = []
  if (xmlFile) {
    try {
      const txt = await (await fetch('/api/file/' + encodeURIComponent(xmlFile.name) + '?view=1')).text()
      dmList = parseDanmaku(txt)
    } catch (_) {}
  }
  $('#dmInfo').textContent = dmList.length ? dmList.length + ' 条弹幕' : '无同名弹幕文件'
  $('#playerName').textContent = name
  $('#playerWrap').classList.remove('hidden')
  v.src = '/api/file/' + encodeURIComponent(name) + '?view=1'
  v.play().catch(() => {})
  dmResize()
}

function closePlayer() {
  const v = $('#playerVideo')
  v.pause(); v.removeAttribute('src'); v.load()
  $('#playerWrap').classList.add('hidden')
  dmList = []; dmActive = []; dmIdx = 0
}

$('#playerClose').onclick = closePlayer
$('#playerWrap').onclick = e => { if (e.target === $('#playerWrap')) closePlayer() }
$('#playerVideo').onseeked = dmSeek
$('#playerVideo').onloadedmetadata = dmResize
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer() })
dmFrame()

// ========== INIT ==========
$('#url').onkeydown = e => { if (e.key === 'Enter') $('#btnParse').click() }
loadFiles()
checkLogin()
loadConfig()
</script>
